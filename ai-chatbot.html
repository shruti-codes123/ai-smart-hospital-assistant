<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Healthcare Chatbot</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <h1>AI Healthcare Chatbot</h1>

    <nav>

        <a href="patient-dashboard.html">
            Dashboard
        </a>

        <a href="index.html">
            Home
        </a>

    </nav>

</header>



<div class="chat-box">

    <h2>AI Health Assistant 🤖</h2>


    <div
        class="chat-area"
        id="chatArea"
    >

        <p>
            <b>AI Assistant:</b>
            Hello! 👋 How can I help you today?
        </p>

    </div>



    <div>

        <input
            type="text"
            id="userInput"
            placeholder="Ask your health query..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>


</div>



<script>


function sendMessage() {

    const input =
        document.getElementById("userInput");

    const chatArea =
        document.getElementById("chatArea");


    const message =
        input.value.trim();


    if (message === "") {

        return;

    }


    // Display user message

    const userMessage =
        document.createElement("p");

    userMessage.innerHTML =
        "<b>You:</b> " + message;

    chatArea.appendChild(
        userMessage
    );


    // Generate AI response

    const response =
        getHealthcareResponse(
            message.toLowerCase()
        );


    setTimeout(function() {

        const aiMessage =
            document.createElement("p");

        aiMessage.innerHTML =
            "<b>AI Assistant:</b> "
            + response;

        chatArea.appendChild(
            aiMessage
        );


        chatArea.scrollTop =
            chatArea.scrollHeight;

    }, 500);


    input.value = "";

    input.focus();

}



function getHealthcareResponse(message) {


    if (
        message.includes("fever")
        || message.includes("bukhar")
    ) {

        return "For fever, stay hydrated, rest properly, and monitor your temperature. If the fever is high, persistent, or accompanied by serious symptoms, consult a doctor.";

    }


    if (
        message.includes("headache")
        || message.includes("sir dard")
    ) {

        return "For a mild headache, rest, drink enough water, and avoid excessive screen time. If headaches are severe, frequent, or sudden, seek medical attention.";

    }


    if (
        message.includes("cough")
        || message.includes("khansi")
    ) {

        return "For a mild cough, stay hydrated and rest. If you have breathing difficulty, chest pain, blood in cough, or persistent symptoms, consult a doctor.";

    }


    if (
        message.includes("cold")
        || message.includes("sardi")
    ) {

        return "For common cold symptoms, take adequate rest, drink fluids, and maintain good hygiene. Consult a doctor if symptoms become severe or persistent.";

    }


    if (
        message.includes("diabetes")
        || message.includes("sugar")
    ) {

        return "Diabetes management depends on blood glucose levels, diet, activity, and medical advice. Regular monitoring and consultation with a healthcare professional are important.";

    }


    if (
        message.includes("blood pressure")
        || message.includes("bp")
    ) {

        return "Blood pressure should be monitored regularly. A consistently high reading should be discussed with a healthcare professional.";

    }


    if (
        message.includes("heart")
        || message.includes("chest pain")
    ) {

        return "Chest pain or severe heart-related symptoms can require urgent medical attention. If chest pain is severe, persistent, or associated with breathing difficulty, seek emergency medical care.";

    }


    if (
        message.includes("medicine")
        || message.includes("dawai")
    ) {

        return "I can provide general health information, but I cannot prescribe medicines. Please consult a qualified doctor or pharmacist before taking medication.";

    }


    if (
        message.includes("hello")
        || message.includes("hi")
        || message.includes("hey")
    ) {

        return "Hello! 👋 I am your AI Healthcare Assistant. You can ask me about common health topics such as fever, headache, cough, blood pressure, diabetes, and general wellness.";

    }


    if (
        message.includes("thank")
        || message.includes("thanks")
    ) {

        return "You're welcome! 😊 Stay healthy and take care.";

    }


    return "I can provide general healthcare information about common symptoms and health topics. For diagnosis, emergencies, or personalized medical advice, please consult a qualified healthcare professional.";

}



document
    .getElementById("userInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


</script>


</body>

</html>
