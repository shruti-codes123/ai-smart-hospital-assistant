<!DOCTYPE html>
<html>
<head>
    <title>Patient Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

    <h2>Patient Login</h2>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="loginPatient()">Login</button>

    <p>
        New Patient?
        <a href="patient-register.html">Register Here</a>
    </p>

</div>

<script>
async function loginPatient() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter email and password");
        return;
    }

    try {

        const response = await fetch("http://127.0.0.1:5000/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const result = await response.json();

        if (response.ok) {

            alert(result.message);

            localStorage.setItem("patient_id", result.patient_id);
            localStorage.setItem("patient_name", result.name);
            localStorage.setItem("patient_email", result.email);

            window.location.href = "patient-dashboard.html";

        } else {

            alert(result.message);

        }

    } catch (error) {

        alert("Backend server is not running!");
        console.error(error);

    }
}
</script>

</body>
</html>
